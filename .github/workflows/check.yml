name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: ['8.12.0', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_ui.py
      - run: node tests/run.js
      - run: sh -n install.sh && sh -n installer/install-local.sh && sh -n installer/uninstall.sh
      - run: python tools/build_release.py
